<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIGI WORKS — SES契約管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen" class="login-screen">
  <div class="login-bg">
    <div class="login-bg-grid"></div>
  </div>
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">M</span>
      <div>
        <div class="logo-name">MIGI WORKS</div>
        <div class="logo-sub">SES Contract Management</div>
      </div>
    </div>
    <h2 class="login-title">ログイン</h2>
    <p class="login-desc">チームアカウントでサインインしてください</p>
    <div id="login-error" class="login-error hidden">メールアドレスまたはパスワードが違います</div>
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="login-email" class="input" placeholder="your@company.com">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="login-password" class="input" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" class="app hidden">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <span class="logo-mark-sm">M</span>
      <div>
        <div class="logo-name-sm">MIGI WORKS</div>
        <div class="logo-sub-sm">SES Management</div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="nav-group-label">メインメニュー</div>
      <a class="nav-item active" data-view="dashboard" onclick="showView('dashboard',this)">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="currentColor"/></svg>
        ダッシュボード
      </a>

      <div class="nav-group-label">SES管理</div>
      <a class="nav-item" data-view="attendance" onclick="showView('attendance',this)">
        <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="5" y1="1" x2="5" y2="4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="11" y1="1" x2="11" y2="4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="4" y1="8" x2="8" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        稼働管理一覧
        <span class="nav-badge" id="att-badge">3</span>
      </a>
      <a class="nav-item" data-view="contracts" onclick="showView('contracts',this)">
        <svg viewBox="0 0 16 16"><rect x="2" y="1" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="5" y1="5" x2="11" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="5" y1="11" x2="8" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        契約管理
      </a>

      <div class="nav-group-label">その他</div>
      <a class="nav-item" data-view="clients" onclick="showView('clients',this)">
        <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="1" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="6" x2="5" y2="14" stroke="currentColor" stroke-width="1.2"/></svg>
        取引先一覧
      </a>
      <a class="nav-item" data-view="company-settings" onclick="showView('company-settings',this)">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.22 3.22l1.42 1.42M11.36 11.36l1.42 1.42M3.22 12.78l1.42-1.42M11.36 4.64l1.42-1.42" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        自社情報設定
      </a>
      <a class="nav-item" data-view="email-templates" onclick="showView('email-templates',this)">
        <svg viewBox="0 0 16 16"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none"/><polyline points="1,3 8,9 15,3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        メールテンプレート
      </a>
      <a class="nav-item" data-view="team" onclick="showView('team',this)">
        <svg viewBox="0 0 16 16"><circle cx="5.5" cy="5.5" r="2.2" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="11" cy="5" r="1.8" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M1 13c0-2.485 2.015-4.5 4.5-4.5S10 10.515 10 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M11 8.5c1.657 0 3 1.343 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        チーム管理
      </a>
    </nav>

    <div class="sb-footer">
      <div class="sb-user-card">
        <div class="user-avatar" id="sb-avatar">MG</div>
        <div class="user-info">
          <div class="user-name" id="sb-username">三木 太郎</div>
          <div class="user-role" id="sb-userrole">管理者</div>
        </div>
        <button class="logout-btn" onclick="doLogout()" title="ログアウト">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 3l4 5-4 5M14 8H6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <svg viewBox="0 0 16 16" width="18" height="18"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <h1 class="page-title" id="page-title">ダッシュボード</h1>
      </div>
      <div class="topbar-right">
        <div class="search-wrap">
          <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <input type="text" class="search-input" placeholder="契約名・会社名で検索...">
        </div>
        <div class="notif-btn" title="通知">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1a5 5 0 0 1 5 5v3l1.5 2H1.5L3 9V6a5 5 0 0 1 5-5z" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          <span class="notif-dot"></span>
        </div>
        <button class="btn-primary" id="topbar-cta" onclick="topbarCTA()">＋ 新規契約</button>
      </div>
    </header>

    <main class="content-area" id="content-area">
      <!-- Views injected here -->
    </main>
  </div>
</div>

<!-- ===== MODALS ===== -->
<!-- Invoice/Doc Preview Modal -->
<div class="modal-overlay hidden" id="doc-modal" onclick="if(event.target===this)closeModal('doc-modal')">
  <div class="doc-modal-inner">
    <div class="doc-paper" id="doc-paper"></div>
    <div class="doc-modal-actions">
      <button class="btn-outline" onclick="alert('PDFをダウンロードしました ✓')">📥 PDFダウンロード</button>
      <button class="btn-outline" onclick="alert('印刷を開始します')">🖨 印刷</button>
      <button class="btn-outline" onclick="openEmailSend()">📧 メール送付</button>
      <button class="btn-ghost" onclick="closeModal('doc-modal')">閉じる</button>
    </div>
  </div>
</div>

<!-- Contract Form Modal -->
<div class="modal-overlay hidden" id="contract-modal" onclick="if(event.target===this)closeModal('contract-modal')">
  <div class="modal-card" style="width:560px">
    <div class="modal-header">
      <h3>新規契約作成</h3>
      <button class="modal-close" onclick="closeModal('contract-modal')">✕</button>
    </div>
    <div class="modal-body" id="contract-form-body">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<!-- Email Send Modal -->
<div class="modal-overlay hidden" id="email-modal" onclick="if(event.target===this)closeModal('email-modal')">
  <div class="modal-card" style="width:560px;max-height:90vh;display:flex;flex-direction:column">
    <div class="modal-header">
      <h3 id="email-modal-title">メール送付</h3>
      <button class="modal-close" onclick="closeModal('email-modal')">✕</button>
    </div>
    <div class="modal-body" id="email-modal-body" style="overflow-y:auto;flex:1"></div>
  </div>
</div>

<!-- Billing Calc Modal -->
<div class="modal-overlay hidden" id="billing-modal" onclick="if(event.target===this)closeModal('billing-modal')">
  <div class="modal-card" style="width:520px">
    <div class="modal-header">
      <h3 id="billing-modal-title">超過控除計算</h3>
      <button class="modal-close" onclick="closeModal('billing-modal')">✕</button>
    </div>
    <div class="modal-body" id="billing-modal-body"></div>
  </div>
</div>

<!-- Team Invite Modal -->
<div class="modal-overlay hidden" id="invite-modal" onclick="if(event.target===this)closeModal('invite-modal')">
  <div class="modal-card" style="width:460px">
    <div class="modal-header">
      <h3>メンバーを招待</h3>
      <button class="modal-close" onclick="closeModal('invite-modal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" class="input" placeholder="invite@company.com" id="invite-email">
      </div>
      <div class="form-group">
        <label>権限</label>
        <select class="input" id="invite-role">
          <option>管理者</option>
          <option>営業</option>
          <option>人事</option>
          <option>閲覧のみ</option>
        </select>
      </div>
      <div class="form-group">
        <label>招待メッセージ（任意）</label>
        <textarea class="input" rows="3" placeholder="チームへようこそ！MIGI WORKSを使ってSES管理を効率化しましょう。"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="closeModal('invite-modal')">キャンセル</button>
        <button class="btn-primary" onclick="sendInvite()">招待を送る</button>
      </div>
    </div>
  </div>
</div>

<!-- Email Template Edit Modal -->
<div class="modal-overlay hidden" id="template-modal" onclick="if(event.target===this)closeModal('template-modal')">
  <div class="modal-card" style="width:640px">
    <div class="modal-header">
      <h3 id="template-modal-title">テンプレート編集</h3>
      <button class="modal-close" onclick="closeModal('template-modal')">✕</button>
    </div>
    <div class="modal-body" id="template-modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  function tryInitSupabase() {
    if (window.supabase && window.supabase.createClient) {
      initSupabase();
      console.log('Supabase initialized ✓');
    } else {
      setTimeout(tryInitSupabase, 100);
    }
  }
  document.addEventListener('DOMContentLoaded', tryInitSupabase);
</script>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
